## Telegraf Configuration for ThinClients
## /etc/telegraf/telegraf.conf

[global_tags]
  service_name = "thinclient"
  env = "prod"
  team = "planetexpress"

## Configuration for telegraf agent
[agent]
  ## Data input and output settings
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "5s"

  ## Logging configuration
  debug = false
  quiet = false
  # emtpy string means log to stderr
  logfile = ""

  ## host configuration
  # if emtpty use os.hostname()
  hostname = ""

  omit_hostname = false

## Metrics to log

[[inputs.system]]
  name_prefix = "dg.systemengineering.thinclient."
  # default configuration; getting uptime values.

[[inputs.mem]]
  name_prefix = "dg.systemengineering.thinclient."
  # no configuration

[[inputs.disk]]
  name_prefix = "dg.systemengineering.thinclient."
  ## By default stats will be gathered for all mount points.
  ## Set mount_points will restrict the stats to only the specified mount points.
  mount_points = ["/"]
